<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You &mdash; Larue County Class of 2006 Reunion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #101d3a;
    color: #ffffff;
    font-family: 'Source Sans 3', sans-serif;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 480px; }
  img.logo { width: 96px; height: auto; margin-bottom: 24px; }
  h1 {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    font-size: 2.4rem;
    margin: 0 0 16px;
  }
  p {
    font-size: 1.1rem;
    color: #dbe2f7;
    line-height: 1.6;
    margin: 0 0 28px;
  }
  a.home {
    display: inline-block;
    background: #ffffff;
    color: #101d3a;
    text-decoration: none;
    font-weight: 600;
    padding: 14px 30px;
    border-radius: 3px;
  }
  a.home:hover { background: #dbe2f7; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="Larue_Logo_06.png" alt="Larue County logo">
    <h1>You're All Set!</h1>
    <p>Your payment went through and your ticket is on its way to your email. Can't wait to see you at the reunion!</p>
    <a class="home" href="/">Back to the Reunion Site</a>
  </div>
</body>
</html>
