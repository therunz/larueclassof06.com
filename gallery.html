<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reunion photos | Larue County Class of 2006</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="nav" aria-label="Main">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img src="Larue_Logo_06.png" alt="" data-hide>
      <span>Class of 2006</span>
    </a>
    <ul>
      <li><a class="link" href="index.html">Home</a></li>
      <li><a class="link" href="gallery.html" aria-current="page">Photos</a></li>
      <li><a class="link" href="memorial.html">In memoriam</a></li>
      <li><a class="link" href="flappy-hawk.html">Flappy Hawk</a></li>
    </ul>
  </div>
</nav>

<header class="page-head">
  <div class="wrap">
    <h1>Reunion photos</h1>
    <div class="rule"></div>
    <p class="lede">Select a photo to see it full size. Use the arrow keys or swipe to move between photos.</p>
    <nav class="jump" id="jump" aria-label="Jump to a reunion" hidden></nav>
  </div>
</header>

<main id="galleries"></main>

<footer class="foot">
  <div class="wrap">Larue County High School, Class of 2006</div>
</footer>

<!-- Photo viewer -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <button class="ctl close" id="lbClose" type="button" aria-label="Close photo viewer">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 16M20 4L4 20"/></svg>
  </button>
  <button class="ctl prev" id="lbPrev" type="button" aria-label="Previous photo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3L6 12l9 9"/></svg>
  </button>
  <figure>
    <img id="lbImg" alt="" data-nofallback>
    <figcaption id="lbCap" aria-live="polite"></figcaption>
  </figure>
  <button class="ctl next-btn" id="lbNext" type="button" aria-label="Next photo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3l9 9-9 9"/></svg>
  </button>
  <div class="bar">
    <button class="play" id="lbPlay" type="button">Play slideshow</button>
    <span id="lbCount"></span>
  </div>
</div>

<script src="site.js"></script>
<script>
(function () {
  'use strict';

  // ------------------------------------------------------------------
  // ADD REUNIONS HERE. Newest first. Photos must be named
  //   <prefix><number>.<ext>   e.g. 20th_1.jpeg, 20th_2.jpeg ... 20th_13.jpeg
  // and sit in the same folder as this page. Change `count` if you add photos.
  // ------------------------------------------------------------------
  var REUNIONS = [
    { id: '20th', title: '20th reunion', when: 'October 17, 2026',
      where: "Kayla's Fill-Up Station", prefix: '20th_', ext: 'jpeg', count: 13 }
    // When the older photos arrive, add a line like this above (don't forget the comma):
    // { id: '15th', title: '15th reunion', when: '2021', prefix: '15th_', ext: 'jpeg', count: 8 },
  ];

  var SLIDE_MS = 4500;

  function file(r, n) { return r.prefix + n + '.' + r.ext; }

  // ---------- Build the page ----------
  var host = document.getElementById('galleries');
  var openers = {};

  REUNIONS.forEach(function (r) {
    var sec = document.createElement('section');
    sec.className = 'reunion';
    sec.id = r.id;
    sec.setAttribute('aria-labelledby', r.id + '-title');

    var wrap = document.createElement('div');
    wrap.className = 'wrap';

    var head = document.createElement('div');
    head.className = 'reunion-head';
    var left = document.createElement('div');
    var h2 = document.createElement('h2');
    h2.id = r.id + '-title';
    h2.textContent = r.title;
    var meta = document.createElement('p');
    meta.textContent = [r.when, r.where, r.count + ' photos'].filter(Boolean).join(', ');
    left.appendChild(h2); left.appendChild(meta);

    var play = document.createElement('button');
    play.type = 'button';
    play.className = 'btn ghost';
    play.textContent = 'Play slideshow';
    play.addEventListener('click', function () { openLightbox(r, 0, true, play); });
    head.appendChild(left); head.appendChild(play);

    var grid = document.createElement('div');
    grid.className = 'masonry';
    for (var i = 0; i < r.count; i++) {
      (function (idx) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'shot';
        b.setAttribute('aria-label', 'Open ' + r.title + ' photo ' + (idx + 1) + ' of ' + r.count);
        var img = document.createElement('img');
        img.src = file(r, idx + 1);
        img.alt = r.title + ' photo ' + (idx + 1);
        img.decoding = 'async';
        if (idx > 5) img.loading = 'lazy';
        b.appendChild(img);
        b.addEventListener('click', function () { openLightbox(r, idx, false, b); });
        grid.appendChild(b);
      })(i);
    }

    wrap.appendChild(head); wrap.appendChild(grid);
    sec.appendChild(wrap);
    host.appendChild(sec);
    openers[r.id] = r;
  });

  // Jump links only matter once there is more than one reunion.
  if (REUNIONS.length > 1) {
    var jump = document.getElementById('jump');
    REUNIONS.forEach(function (r) {
      var a = document.createElement('a');
      a.href = '#' + r.id;
      a.textContent = r.title;
      jump.appendChild(a);
    });
    jump.hidden = false;
  }

  // ---------- Lightbox ----------
  var lb = document.getElementById('lb');
  var lbImg = document.getElementById('lbImg');
  var lbCap = document.getElementById('lbCap');
  var lbCount = document.getElementById('lbCount');
  var lbPlay = document.getElementById('lbPlay');
  var lbClose = document.getElementById('lbClose');
  var lbPrev = document.getElementById('lbPrev');
  var lbNext = document.getElementById('lbNext');

  var cur = null;       // { r, i }
  var timer = null;
  var lastFocus = null;

  function show(i) {
    var r = cur.r;
    cur.i = (i + r.count) % r.count;
    var n = cur.i + 1;
    lbImg.onerror = function () {
      lbImg.removeAttribute('src');
      lbCap.textContent = 'This photo isn’t uploaded yet (' + file(r, n) + ').';
    };
    lbImg.alt = r.title + ' photo ' + n;
    lbImg.src = file(r, n);
    lbCap.textContent = r.title + ', photo ' + n + ' of ' + r.count;
    lbCount.textContent = n + ' / ' + r.count;
    // warm the cache for the next photo
    var pre = new Image();
    pre.src = file(r, (cur.i + 1) % r.count + 1);
    try { history.replaceState(null, '', '#' + r.id + '-' + n); } catch (e) {}
  }

  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
    lbPlay.textContent = 'Play slideshow';
  }
  function start() {
    stop();
    lbPlay.textContent = 'Pause slideshow';
    timer = setInterval(function () { show(cur.i + 1); }, SLIDE_MS);
  }
  function step(d) {
    show(cur.i + d);
    if (timer) start();   // restart the clock after a manual move
  }

  function openLightbox(r, i, autoplay, opener) {
    cur = { r: r, i: i };
    lastFocus = opener || document.activeElement;
    lb.hidden = false;
    document.body.style.overflow = 'hidden';
    show(i);
    if (autoplay) start(); else stop();
    lbClose.focus();
  }

  function closeLightbox() {
    stop();
    lb.hidden = true;
    lbImg.removeAttribute('src');
    document.body.style.overflow = '';
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    cur = null;
  }

  lbClose.addEventListener('click', closeLightbox);
  lbPrev.addEventListener('click', function () { step(-1); });
  lbNext.addEventListener('click', function () { step(1); });
  lbPlay.addEventListener('click', function () { if (timer) stop(); else start(); });
  lb.addEventListener('click', function (e) { if (e.target === lb) closeLightbox(); });

  document.addEventListener('keydown', function (e) {
    if (lb.hidden) return;
    if (e.key === 'Escape') { closeLightbox(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === 'Tab') {
      // keep keyboard focus inside the viewer
      var f = [lbClose, lbPrev, lbNext, lbPlay];
      var idx = f.indexOf(document.activeElement);
      e.preventDefault();
      f[(idx + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    }
  });

  // Swipe on touch screens
  var sx = null;
  lb.addEventListener('touchstart', function (e) { sx = e.changedTouches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx;
    sx = null;
    if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
  }, { passive: true });

  // Deep link, e.g. gallery.html#20th-3 opens straight to that photo.
  var m = /^#([\w-]+?)-(\d+)$/.exec(location.hash);
  if (m && openers[m[1]]) {
    var r = openers[m[1]], n = parseInt(m[2], 10);
    if (n >= 1 && n <= r.count) openLightbox(r, n - 1, false, null);
  }
})();
</script>
</body>
</html>
