<header class="page-head">
  <div class="wrap">
    <h1>In memoriam</h1>
    <div class="rule"></div>
    <p class="lede">We remember the members of our class we have lost. They walked the halls with us, and they will always be part of the Class of 2006.</p>
  </div>
</header>

<main class="memorial-section">
  <div class="wrap">
    <!-- To add someone: copy one <li> block, then change the file name, alt text, and name.
         Photos are named after the person, e.g. Tiffany.jpg (capital first letter, .jpg); the name and years shown are typed in the figcaption. -->
    <ul class="memorial">
      <li>
        <figure>
          <div class="frame"><img src="Tiffany.jpg" alt="Tiffany Underwood Clifford, 1988 – 2024" data-ph="Tiffany.jpg"></div>
          <figcaption>Tiffany Underwood Clifford<span class="years">1988 – 2024</span></figcaption>
        </figure>
      </li>
      <li>
        <figure>
          <div class="frame"><img src="Nancy.jpg" alt="Nancy Smith Hart, 1986 – 2026" data-ph="Nancy.jpg"></div>
          <figcaption>Nancy Smith Hart<span class="years">1986 – 2026</span></figcaption>
        </figure>
      </li>
      <li>
        <figure>
          <div class="frame"><img src="Josh.jpg" alt="Josh Braden, 1987 – 2025" data-ph="Josh.jpg"></div>
          <figcaption>Josh Braden<span class="years">1987 – 2025</span></figcaption>
        </figure>
      </li>
      <li>
        <figure>
          <div class="frame"><img src="Magen.jpg" alt="Magen Shianne Cottrell, 1987 – 2017" data-ph="Magen.jpg"></div>
          <figcaption>Magen Shianne Cottrell<span class="years">1987 – 2017</span></figcaption>
        </figure>
      </li>
    </ul>
  </div>
</main>
